server:
  port: 8080

spring:
  application:
    name: gateway-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

  jackson:
    serialization:
      indent-output: true

route-service:
  url: ${ROUTE_SERVICE_URL}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.fleet.gateway: DEBUG
