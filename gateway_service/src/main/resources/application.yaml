server:
  port: 8080

spring:
  application:
    name: gateway-service

  datasource:
    # Atenție: 'db' este numele serviciului din docker-compose, nu 'localhost'
    url: jdbc:postgresql://db:5432/fleet_db
    # Citim user/parola din variabile de mediu (Best Practice pentru securitate - 10p)
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' creează tabelele automat dacă nu există
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # Utile pentru debugging, vezi query-urile in loguri

  # Configurare Docker Compose support (opțional, dar util în Spring Boot 3.x)
  docker:
    compose:
      enabled: true

# Configurare Actuator (pentru Observabilitate - 10p)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method  # Le sortează frumos după GET, POST, etc.