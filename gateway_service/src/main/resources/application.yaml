server:
  port: 8080

spring:
  application:
    name: gateway-service

  # --- BAZA DE DATE ---
  # Aici Spring citeste variabilele setate in docker-compose.yml
  # care la randul lor vin din fisierul secret .env
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: update  # Creeaza/Actualizeaza automat tabelele in DB
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # (Optional) Arata query-urile SQL in consola, util pentru debug
    open-in-view: false

# --- OBSERVABILITATE (Actuator) ---
management:
  endpoints:
    web:
      exposure:
        include: "*" # Expune toate endpoint-urile (health, metrics, beans, etc.)
  endpoint:
    health:
      show-details: always # Arata detalii complete (stare DB, disc, ping)